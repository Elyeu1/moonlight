name: Build test IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -archivePath "$PWD/build/Moonlight.xcarchive" \
            archive \
            2>&1 | tee build_log.txt

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Moonlight.xcarchive/Products/Applications/Moonlight.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload MoonlightPointerTest.ipa
          shasum -a 256 MoonlightPointerTest.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MoonlightPointerTest-IPA
          path: MoonlightPointerTest.ipa
          if-no-files-found: error
          retention-days: 14
