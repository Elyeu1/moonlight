name: Claude Code Analysis

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Was soll Claude analysieren?"
        required: true
        type: string

jobs:
  claude:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout iphone-pointer-capture
        uses: actions/checkout@v6
        with:
          ref: iphone-pointer-capture
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          display_report: true

          prompt: |
            ANALYSIS ONLY.

            Work exclusively with the current contents of the
            iphone-pointer-capture branch.

            IMPORTANT:
            - iphone-pointer-capture is the ONLY source of truth.
            - Do NOT use master as the codebase.
            - Do NOT modify any files.
            - Do NOT create commits.
            - Do NOT create branches.
            - Do NOT create or modify pull requests.
            - Do NOT push anything.
            - Do NOT attempt to fix anything.
            - Only inspect and analyze the existing code.

            Analyze the repository and answer the user's request in detail.

            Explain:
            1. What the relevant code currently does.
            2. What is implemented well.
            3. What problems, bugs, risks or architectural issues you see.
            4. What could cause the described behavior.
            5. What concrete changes you would recommend.
            6. Why you would make each recommended change.
            7. What possible side effects the changes could have.

            Do not make any changes to the repository.

            User request:
            ${{ inputs.prompt }}

          claude_args: |
            --disallowedTools "Edit,Write"

        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
