name: Claude Code

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Was soll Claude erledigen?"
        required: true
        type: string

jobs:
  claude:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout iphone-pointer-capture
        uses: actions/checkout@v6
        with:
          ref: iphone-pointer-capture
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}

          base_branch: iphone-pointer-capture
          branch_prefix: claude/

          prompt: |
            You are working exclusively on the `iphone-pointer-capture` branch.

            IMPORTANT:
            - Treat `iphone-pointer-capture` as the ONLY source of truth.
            - Do NOT use `master` as the codebase or starting point.
            - Do NOT reset, overwrite, merge, rebase, or modify `master`.
            - Do NOT assume that `master` contains the current implementation.
            - The `iphone-pointer-capture` branch contains intentional changes
              that may differ substantially from `master`.
            - Analyze the actual files currently present in `iphone-pointer-capture`
              before making any changes.
            - Preserve existing functionality unless the requested task requires
              changing it.
            - Create a separate Claude branch based on `iphone-pointer-capture`.
            - Make the requested changes on that branch.
            - Commit the changes.
            - Create a Pull Request targeting `iphone-pointer-capture`.

            User request:

            ${{ inputs.prompt }}

        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
